<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="2; url=https://docs.google.com/forms/d/e/1FAIpQLSewEhL7k-JXgnH-Jp3PdtMCTZKvAGiQbUGvkZKGVcpuAhEkmQ/viewform?usp=header">
    <title>Fractals Group | Clinical AI Registration</title>
    
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* Usa i colori del tema globale */
            background-color: var(--global-bg-color) !important;
            color: var(--global-text-color) !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        
        .loader-container {
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }
        
        /* Spinner orbitale basato sul colore primario del tema */
        .tech-loader {
            width: 70px;
            height: 70px;
            border: 2px solid var(--global-divider-color);
            border-radius: 50%;
            margin: 0 auto 30px auto;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .tech-loader::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid var(--global-theme-color);
            border-radius: 50%;
            border-left-color: transparent;
            border-bottom-color: transparent;
            animation: spin 1s linear infinite;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background: var(--global-theme-color);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--global-theme-color);
        }

        .brand {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--global-theme-color);
            font-weight: 700;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            margin: 0 0 8px 0;
            color: var(--global-text-color);
        }

        p {
            font-size: 0.85rem;
            color: var(--global-text-color);
            opacity: 0.6;
            margin: 0;
            font-weight: 300;
        }

        a {
            color: var(--global-theme-color);
            text-decoration: none;
            border-bottom: 1px dashed var(--global-theme-color);
            transition: opacity 0.2s;
        }
        a:hover {
            opacity: 0.8;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="loader-container">
        <div class="tech-loader">
            <div class="pulse-dot"></div>
        </div>
        <div class="brand">Fractals Research Group</div>
        <h1>Convegno AI & Surgery</h1>
        <p>Connessione al modulo di registrazione...</p>
        
        <p style="margin-top: 40px; font-size: 0.75rem; opacity: 0.4;">
            Il caricamento impiega un secondo. <a href="https://forms.gle/QejLPDntbXDF7xCG8">Clicca qui</a> se non vieni reindirizzato automaticamente.
        </p>
    </div>

    <script type="text/javascript">
        setTimeout(function() {
            window.location.href = "https://forms.gle/QejLPDntbXDF7xCG8";
        }, 500);
    </script>
</body>
</html>
